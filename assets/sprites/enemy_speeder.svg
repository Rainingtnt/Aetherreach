  <!-- Speed trail streaks -->
  <line x1="0" y1="8" x2="0" y2="16" stroke="#1de6b8" stroke-width="2.5" opacity="0.4" stroke-linecap="round"/>
  <line x1="-3" y1="9" x2="-4" y2="15" stroke="#1de6b8" stroke-width="1.2" opacity="0.25" stroke-linecap="round"/>
  <line x1="3" y1="9" x2="4" y2="15" stroke="#1de6b8" stroke-width="1.2" opacity="0.25" stroke-linecap="round"/>
  <!-- Core gem -->
  <ellipse cx="0" cy="-2" rx="3" ry="4" fill="#80fff0" opacity="0.9"/>
  <ellipse cx="0" cy="-2" rx="1.5" ry="2" fill="white" opacity="0.8"/>
