<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -36 56 72" width="112" height="144">
  <!-- Ice gown/train -->
  <path d="M-22,10 Q-26,30 -16,36 Q0,42 16,36 Q26,30 22,10 Z" fill="#0a1a3a"/>
  <path d="M-18,8 Q-22,26 -12,32 Q0,38 12,32 Q22,26 18,8 Z" fill="#102244"/>
  <!-- Bodice -->
  <ellipse cx="0" cy="0" rx="13" ry="17" fill="#0e2255"/>
  <!-- Ice armor chest -->
  <polygon points="0,-12 11,-5 9,6 0,10 -9,6 -11,-5" fill="#1a3a6a"/>
  <!-- Chest frost gem -->
  <polygon points="0,-6 4,-2 4,3 0,6 -4,3 -4,-2" fill="#55aaff"/>
  <polygon points="0,-4 2.5,-1 2.5,2 0,4 -2.5,2 -2.5,-1" fill="#aaddff"/>
  <!-- Head -->
  <ellipse cx="0" cy="-22" rx="11" ry="12" fill="#0e2255"/>
  <!-- Ice crown -->
  <polygon points="-8,-33 -7,-26 -5,-34 -2,-25 0,-35 2,-25 5,-34 7,-26 8,-33 10,-23 -10,-23" fill="#1a3a6a"/>
  <polygon points="-6,-31 -4,-26 0,-33 4,-26 6,-31 8,-24 -8,-24" fill="#55aaff"/>
  <polygon points="0,-29 -3,-25 3,-25" fill="#aaddff"/>
  <!-- Face -->
  <!-- Eyes (cold ice blue) -->
  <ellipse cx="-4.5" cy="-24" rx="4" ry="3" fill="#0a0e18"/>
  <ellipse cx="4.5"  cy="-24" rx="4" ry="3" fill="#0a0e18"/>
  <ellipse cx="-4.5" cy="-24" rx="2.8" ry="2" fill="#4488cc"/>
  <ellipse cx="4.5"  cy="-24" rx="2.8" ry="2" fill="#4488cc"/>
  <ellipse cx="-4.5" cy="-24" rx="1.2" ry="1.2" fill="#aaddff"/>
  <ellipse cx="4.5"  cy="-24" rx="1.2" ry="1.2" fill="#aaddff"/>
  <!-- Eyebrows (stern) -->
  <line x1="-8" y1="-28" x2="-1.5" y2="-26" stroke="#55aaff" stroke-width="1.5" stroke-linecap="round"/>
  <line x1="8"  y1="-28" x2="1.5"  y2="-26" stroke="#55aaff" stroke-width="1.5" stroke-linecap="round"/>
  <!-- Ice wings / shoulder capes -->
  <polygon points="-18,-10 -30,-4 -28,8 -16,4" fill="#0e2255" stroke="#55aaff" stroke-width="0.8"/>
  <polygon points="18,-10 30,-4 28,8 16,4" fill="#0e2255" stroke="#55aaff" stroke-width="0.8"/>
  <!-- Wing crystal veins -->
  <line x1="-18" y1="-10" x2="-28" y2="0" stroke="#55aaff" stroke-width="0.8" opacity="0.5"/>
  <line x1="18"  y1="-10" x2="28"  y2="0" stroke="#55aaff" stroke-width="0.8" opacity="0.5"/>
  <!-- Arms -->
  <ellipse cx="-16" cy="-6" rx="5" ry="4.5" fill="#0e2255"/>
  <ellipse cx="16"  cy="-6" rx="5" ry="4.5" fill="#0e2255"/>
  <!-- Ice gauntlets -->
  <ellipse cx="-19" cy="2" rx="4.5" ry="5.5" fill="#1a3a6a" stroke="#55aaff" stroke-width="0.8"/>
  <ellipse cx="19"  cy="2" rx="4.5" ry="5.5" fill="#1a3a6a" stroke="#55aaff" stroke-width="0.8"/>
  <!-- Frost wisps from hands -->
  <ellipse cx="-21" cy="-4" rx="2.5" ry="4" fill="#55aaff" opacity="0.6"/>
  <ellipse cx="21"  cy="-4" rx="2.5" ry="4" fill="#55aaff" opacity="0.6"/>
  <ellipse cx="-21" cy="-6" rx="1.5" ry="2.5" fill="#aaddff" opacity="0.7"/>
  <ellipse cx="21"  cy="-6" rx="1.5" ry="2.5" fill="#aaddff" opacity="0.7"/>
  <!-- Boot ice -->
  <rect x="-10" y="16" width="8" height="14" rx="3" fill="#0a1a3a" stroke="#1a3a6a" stroke-width="0.7"/>
  <rect x="2"   y="16" width="8" height="14" rx="3" fill="#0a1a3a" stroke="#1a3a6a" stroke-width="0.7"/>
</svg>
