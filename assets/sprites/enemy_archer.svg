<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -18 28 36" width="56" height="72">
  <!-- Cloak body -->
  <ellipse cx="0" cy="4" rx="9" ry="12" fill="#1a2a0a"/>
  <ellipse cx="0" cy="0" rx="7" ry="9" fill="#2a4010"/>
  <!-- Hood -->
  <ellipse cx="0" cy="-10" rx="7" ry="7" fill="#1a2a0a"/>
  <!-- Face -->
  <ellipse cx="0" cy="-10" rx="5" ry="5" fill="#0d1606"/>
  <!-- Eyes (slitted, focused) -->
  <ellipse cx="-2.5" cy="-11" rx="1.8" ry="1.2" fill="#88cc22"/>
  <ellipse cx="2.5"  cy="-11" rx="1.8" ry="1.2" fill="#88cc22"/>
  <ellipse cx="-2.5" cy="-11" rx="0.8" ry="0.8" fill="#0a1400"/>
  <ellipse cx="2.5"  cy="-11" rx="0.8" ry="0.8" fill="#0a1400"/>
  <!-- Bow (held to the side) -->
  <path d="M10,-14 Q16,0 10,14" fill="none" stroke="#5a3a10" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="10" y1="-14" x2="10" y2="14" stroke="#8a5a20" stroke-width="1" opacity="0.7"/>
  <!-- Arrow nocked -->
  <line x1="2" y1="-2" x2="10" y2="-2" stroke="#c8a855" stroke-width="1.2" stroke-linecap="round"/>
  <polygon points="10,-2 8,-4 8,0" fill="#c8a855"/>
  <!-- Arrow fletching -->
  <polygon points="2,-2 0,-4 1,-2" fill="#cc3322" opacity="0.8"/>
  <polygon points="2,-2 0,0 1,-2" fill="#cc3322" opacity="0.8"/>
  <!-- Quiver on back -->
  <rect x="-10" y="-6" width="5" height="12" rx="2" fill="#3a2008" stroke="#6a4010" stroke-width="0.7"/>
  <line x1="-8.5" y1="-8" x2="-8.5" y2="-4" stroke="#c8a855" stroke-width="1"/>
  <line x1="-7"   y1="-9" x2="-7"   y2="-5" stroke="#c8a855" stroke-width="1"/>
</svg>
