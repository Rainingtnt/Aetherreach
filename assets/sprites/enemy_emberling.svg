<svg xmlns="http://www.w3.org/2000/svg" viewBox="-12 -16 24 32" width="48" height="64">
  <!-- Body — round blob -->
  <ellipse cx="0" cy="2" rx="10" ry="10" fill="#cc3300"/>
  <ellipse cx="0" cy="1" rx="7"  ry="8"  fill="#ff5511"/>
  <!-- Face glow -->
  <ellipse cx="0" cy="0" rx="5"  ry="5"  fill="#ff8833" opacity="0.8"/>
  <!-- Eyes — wide crazed -->
  <ellipse cx="-3.5" cy="-1" rx="2.5" ry="2.5" fill="#ffee00"/>
  <ellipse cx="3.5"  cy="-1" rx="2.5" ry="2.5" fill="#ffee00"/>
  <ellipse cx="-3.5" cy="-1" rx="1.2" ry="1.2" fill="#220000"/>
  <ellipse cx="3.5"  cy="-1" rx="1.2" ry="1.2" fill="#220000"/>
  <!-- Flame crown -->
  <polygon points="0,-12 -2,-7 2,-7"   fill="#ff6600"/>
  <polygon points="-5,-10 -7,-5 -3,-5" fill="#ff4400"/>
  <polygon points="5,-10 7,-5 3,-5"    fill="#ff4400"/>
  <!-- Inner flame -->
  <polygon points="0,-10 -1,-7 1,-7"   fill="#ffcc00"/>
  <!-- Feet/sparks -->
  <ellipse cx="-5"  cy="10" rx="3.5" ry="2" fill="#cc3300"/>
  <ellipse cx="5"   cy="10" rx="3.5" ry="2" fill="#cc3300"/>
  <circle cx="-8"  cy="6"  r="1.5" fill="#ff6600" opacity="0.7"/>
  <circle cx="8"   cy="6"  r="1.5" fill="#ff6600" opacity="0.7"/>
  <circle cx="0"   cy="11" r="1.2" fill="#ff8800" opacity="0.5"/>
</svg>
