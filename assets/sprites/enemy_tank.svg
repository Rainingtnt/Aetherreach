<svg xmlns="http://www.w3.org/2000/svg" viewBox="-18 -18 36 36" width="72" height="72">
  <!-- Shield body -->
  <polygon points="0,-18 15,-12 18,0 15,12 0,18 -15,12 -18,0 -15,-12" fill="#3a3a5c"/>
  <!-- Armor plates -->
  <polygon points="0,-14 11,-9 14,0 11,9 0,14 -11,9 -14,0 -11,-9" fill="#4a4a70" stroke="#6666aa" stroke-width="0.8"/>
  <!-- Chest gem -->
  <polygon points="0,-7 5,-3 5,3 0,7 -5,3 -5,-3" fill="#8888cc"/>
  <polygon points="0,-5 3,-2 3,2 0,5 -3,2 -3,-2" fill="#aaaaff"/>
  <!-- Shoulder spikes -->
  <polygon points="-15,-12 -22,-15 -18,-6" fill="#3a3a5c"/>
  <polygon points="15,-12 22,-15 18,-6" fill="#3a3a5c"/>
  <!-- Helmet visor (angry) -->
  <line x1="-7" y1="-9" x2="-2" y2="-7" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/>
  <line x1="7"  y1="-9" x2="2"  y2="-7" stroke="#ff4444" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Eyes under visor -->
  <ellipse cx="-5" cy="-8" rx="2" ry="1.5" fill="#ff6666" opacity="0.8"/>
  <ellipse cx="5"  cy="-8" rx="2" ry="1.5" fill="#ff6666" opacity="0.8"/>
  <!-- Knee guards -->
  <ellipse cx="-10" cy="9" rx="4" ry="3" fill="#3a3a5c" stroke="#6666aa" stroke-width="0.7"/>
  <ellipse cx="10"  cy="9" rx="4" ry="3" fill="#3a3a5c" stroke="#6666aa" stroke-width="0.7"/>
</svg>
