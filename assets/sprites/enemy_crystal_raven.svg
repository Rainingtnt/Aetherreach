<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -14 32 28" width="64" height="56">
  <!-- Body — sleek angular bird -->
  <polygon points="0,-13 10,2 4,8 0,6 -4,8 -10,2" fill="#1a3a5a"/>
  <polygon points="0,-10 7,1 3,6 0,4 -3,6 -7,1" fill="#2255aa"/>
  <!-- Head -->
  <ellipse cx="0" cy="-10" rx="5" ry="4.5" fill="#1a3a5a"/>
  <!-- Beak -->
  <polygon points="0,-13 -2,-10 2,-10" fill="#aaddff"/>
  <!-- Eye -->
  <ellipse cx="0" cy="-10" rx="2.5" ry="2" fill="#55aaff"/>
  <ellipse cx="0" cy="-10" rx="1.2" ry="1.2" fill="#001122"/>
  <!-- Ice crystal wings -->
  <polygon points="-10,2 -20,-4 -16,4 -10,6" fill="#2255aa" opacity="0.85"/>
  <polygon points="10,2 20,-4 16,4 10,6" fill="#2255aa" opacity="0.85"/>
  <!-- Wing crystal spikes -->
  <polygon points="-20,-4 -24,-8 -22,-2" fill="#55aaff" opacity="0.7"/>
  <polygon points="20,-4 24,-8 22,-2" fill="#55aaff" opacity="0.7"/>
  <!-- Ice trail feathers -->
  <polygon points="-4,8 -8,14 -2,10" fill="#aaddff" opacity="0.5"/>
  <polygon points="4,8 8,14 2,10"  fill="#aaddff" opacity="0.5"/>
  <!-- Icy center gem -->
  <polygon points="0,-4 3,0 0,4 -3,0" fill="#aaddff" opacity="0.8"/>
</svg>
