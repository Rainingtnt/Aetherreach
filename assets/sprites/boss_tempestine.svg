<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -36 56 72" width="112" height="144">
  <!-- Storm cloak (floating, no ground contact) -->
  <path d="M-20,6 Q-28,20 -20,30 Q0,38 20,30 Q28,20 20,6 Z" fill="#10062a" opacity="0.9"/>
  <path d="M-16,4 Q-22,16 -14,26 Q0,34 14,26 Q22,16 16,4 Z" fill="#18083a"/>
  <!-- Body -->
  <ellipse cx="0" cy="-2" rx="13" ry="16" fill="#200a4a"/>
  <!-- Storm armor -->
  <polygon points="0,-14 11,-6 9,5 0,10 -9,5 -11,-6" fill="#2a1060"/>
  <!-- Lightning vein pattern on armor -->
  <path d="M0,-12 L-3,-6 L2,-2 L-2,4 L0,8" fill="none" stroke="#ffee22" stroke-width="1" opacity="0.7"/>
  <!-- Chest orb -->
  <circle cx="0" cy="-2" r="5" fill="#4a20aa"/>
  <circle cx="0" cy="-2" r="3" fill="#8844ff"/>
  <circle cx="0" cy="-2" r="1.5" fill="#ffee22" opacity="0.9"/>
  <!-- Head -->
  <ellipse cx="0" cy="-22" rx="11" ry="12" fill="#200a4a"/>
  <!-- Lightning crown -->
  <polygon points="-8,-32 -7,-25 -5,-33 -2,-24 0,-34 2,-24 5,-33 7,-25 8,-32 10,-23 -10,-23" fill="#2a1060"/>
  <polygon points="-5,-30 -3,-25 0,-32 3,-25 5,-30 7,-24 -7,-24" fill="#8844ff"/>
  <!-- Crown lightning bolt center -->
  <polygon points="0,-34 -2,-28 0,-30 2,-28" fill="#ffee22"/>
  <!-- Eyes (electric yellow/white) -->
  <ellipse cx="-4.5" cy="-23" rx="4" ry="3" fill="#080414"/>
  <ellipse cx="4.5"  cy="-23" rx="4" ry="3" fill="#080414"/>
  <ellipse cx="-4.5" cy="-23" rx="2.8" ry="2" fill="#cc88ff"/>
  <ellipse cx="4.5"  cy="-23" rx="2.8" ry="2" fill="#cc88ff"/>
  <ellipse cx="-4.5" cy="-23" rx="1.4" ry="1.4" fill="#ffee22"/>
  <ellipse cx="4.5"  cy="-23" rx="1.4" ry="1.4" fill="#ffee22"/>
  <!-- Storm wings -->
  <path d="M-13,-8 Q-32,-6 -34,8 Q-28,14 -16,6" fill="#18083a" stroke="#8844ff" stroke-width="0.8"/>
  <path d="M13,-8 Q32,-6 34,8 Q28,14 16,6" fill="#18083a" stroke="#8844ff" stroke-width="0.8"/>
  <!-- Wing lightning veins -->
  <path d="M-13,-8 L-28,0 L-22,8" fill="none" stroke="#ffee22" stroke-width="0.8" opacity="0.5"/>
  <path d="M13,-8 L28,0 L22,8"   fill="none" stroke="#ffee22" stroke-width="0.8" opacity="0.5"/>
  <!-- Arms / gauntlets -->
  <ellipse cx="-16" cy="-4" rx="5" ry="4.5" fill="#200a4a"/>
  <ellipse cx="16"  cy="-4" rx="5" ry="4.5" fill="#200a4a"/>
  <ellipse cx="-20" cy="4"  rx="4.5" ry="5.5" fill="#2a1060" stroke="#8844ff" stroke-width="0.8"/>
  <ellipse cx="20"  cy="4"  rx="4.5" ry="5.5" fill="#2a1060" stroke="#8844ff" stroke-width="0.8"/>
  <!-- Electric discharge from hands -->
  <path d="M-22,-2 L-26,-6 L-24,-4 L-28,-1" fill="none" stroke="#ffee22" stroke-width="1.2"/>
  <path d="M22,-2 L26,-6 L24,-4 L28,-1"  fill="none" stroke="#ffee22" stroke-width="1.2"/>
  <!-- Floating: no boot contact, trailing sparks instead -->
  <circle cx="-6" cy="28" r="2" fill="#8844ff" opacity="0.6"/>
  <circle cx="6"  cy="30" r="1.5" fill="#ffee22" opacity="0.5"/>
  <circle cx="0"  cy="32" r="1.8" fill="#8844ff" opacity="0.4"/>
</svg>
