<svg xmlns="http://www.w3.org/2000/svg" viewBox="-28 -36 56 72" width="112" height="144">
  <!-- Cape / mantle -->
  <path d="M-24,8 Q-28,28 -18,34 Q0,40 18,34 Q28,28 24,8 Z" fill="#8a1a00"/>
  <path d="M-20,6 Q-24,24 -14,30 Q0,36 14,30 Q24,24 20,6 Z" fill="#c02800"/>
  <!-- Body torso -->
  <ellipse cx="0" cy="2" rx="14" ry="18" fill="#c02800"/>
  <!-- Armored chest -->
  <polygon points="0,-14 12,-6 10,8 0,12 -10,8 -12,-6" fill="#e83a00"/>
  <!-- Chest gem (fire) -->
  <polygon points="0,-8 5,-3 5,4 0,8 -5,4 -5,-3" fill="#ffaa00"/>
  <polygon points="0,-6 3,-2 3,3 0,6 -3,3 -3,-2" fill="#fff066"/>
  <!-- Head -->
  <ellipse cx="0" cy="-22" rx="12" ry="13" fill="#c02800"/>
  <!-- Crown of flames -->
  <polygon points="-8,-34 -6,-28 -4,-35 -2,-27 0,-36 2,-27 4,-35 6,-28 8,-34 10,-24 -10,-24" fill="#ff6600"/>
  <polygon points="-6,-32 -4,-27 0,-34 4,-27 6,-32 8,-25 -8,-25" fill="#ffaa00"/>
  <polygon points="0,-30 -3,-26 3,-26" fill="#fff066"/>
  <!-- Eyes (fierce) -->
  <ellipse cx="-5" cy="-24" rx="4.5" ry="3.5" fill="#200000"/>
  <ellipse cx="5"  cy="-24" rx="4.5" ry="3.5" fill="#200000"/>
  <ellipse cx="-5" cy="-24" rx="3" ry="2.2" fill="#ff6600"/>
  <ellipse cx="5"  cy="-24" rx="3" ry="2.2" fill="#ff6600"/>
  <ellipse cx="-5" cy="-24" rx="1.5" ry="1.5" fill="#ffcc00"/>
  <ellipse cx="5"  cy="-24" rx="1.5" ry="1.5" fill="#ffcc00"/>
  <!-- Eyebrow lines (angry) -->
  <line x1="-9" y1="-28" x2="-1" y2="-26" stroke="#ff2200" stroke-width="2" stroke-linecap="round"/>
  <line x1="9"  y1="-28" x2="1"  y2="-26" stroke="#ff2200" stroke-width="2" stroke-linecap="round"/>
  <!-- Arms / pauldrons -->
  <ellipse cx="-17" cy="-8" rx="6" ry="5" fill="#8a1a00"/>
  <ellipse cx="17"  cy="-8" rx="6" ry="5" fill="#8a1a00"/>
  <!-- Gauntlets -->
  <ellipse cx="-20" cy="0" rx="5" ry="6" fill="#c02800" stroke="#ff6600" stroke-width="0.8"/>
  <ellipse cx="20"  cy="0" rx="5" ry="6" fill="#c02800" stroke="#ff6600" stroke-width="0.8"/>
  <!-- Flame wisps from hands -->
  <ellipse cx="-22" cy="-6" rx="3" ry="5" fill="#ff6600" opacity="0.7"/>
  <ellipse cx="-22" cy="-8" rx="2" ry="3" fill="#ffcc00" opacity="0.6"/>
  <ellipse cx="22"  cy="-6" rx="3" ry="5" fill="#ff6600" opacity="0.7"/>
  <ellipse cx="22"  cy="-8" rx="2" ry="3" fill="#ffcc00" opacity="0.6"/>
  <!-- Leg guards -->
  <rect x="-10" y="14" width="8" height="14" rx="3" fill="#8a1a00" stroke="#e83a00" stroke-width="0.7"/>
  <rect x="2"   y="14" width="8" height="14" rx="3" fill="#8a1a00" stroke="#e83a00" stroke-width="0.7"/>
  <!-- Boots -->
  <ellipse cx="-6" cy="28" rx="6" ry="4" fill="#5a0a00"/>
  <ellipse cx="6"  cy="28" rx="6" ry="4" fill="#5a0a00"/>
