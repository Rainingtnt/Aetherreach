<svg xmlns="http://www.w3.org/2000/svg" viewBox="-16 -20 32 40" width="64" height="80">
  <!-- Cloak / body -->
  <ellipse cx="0" cy="4" rx="11" ry="14" fill="#1a0a2e"/>
  <ellipse cx="0" cy="2" rx="9" ry="12" fill="#2d1b4e"/>
  <!-- Hood -->
  <ellipse cx="0" cy="-10" rx="9" ry="9" fill="#1a0a2e"/>
  <!-- Face glow -->
  <ellipse cx="0" cy="-9" rx="6" ry="6" fill="#0d0618"/>
  <ellipse cx="0" cy="-9" rx="4" ry="4" fill="#6a3aff" opacity="0.8"/>
  <!-- Eyes -->
  <ellipse cx="-3" cy="-10" rx="1.8" ry="1.4" fill="#c8aaff"/>
  <ellipse cx="3"  cy="-10" rx="1.8" ry="1.4" fill="#c8aaff"/>
  <!-- Cloak trim -->
  <path d="M-11,4 Q-14,14 -8,18 Q0,20 8,18 Q14,14 11,4" fill="#3d2060" stroke="#6a3aff" stroke-width="0.8"/>
  <!-- Arcane orb (staff tip) -->
  <circle cx="12" cy="-4" r="4" fill="#7b4fff" opacity="0.9"/>
  <circle cx="12" cy="-4" r="2.2" fill="#c8aaff"/>
  <!-- Staff -->
  <line x1="4" y1="2" x2="11" y2="-3" stroke="#4a2a8a" stroke-width="2.5" stroke-linecap="round"/>
  <!-- Shoulder guards -->
  <ellipse cx="-10" cy="-2" rx="4" ry="2.5" fill="#3d2060" stroke="#6a3aff" stroke-width="0.6"/>
  <ellipse cx="10"  cy="-2" rx="4" ry="2.5" fill="#3d2060" stroke="#6a3aff" stroke-width="0.6"/>
</svg>
