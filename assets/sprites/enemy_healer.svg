<svg xmlns="http://www.w3.org/2000/svg" viewBox="-14 -18 28 36" width="56" height="72">
  <!-- Flowing robe bottom -->
  <ellipse cx="0" cy="8" rx="10" ry="10" fill="#0a3a1a"/>
  <!-- Body -->
  <ellipse cx="0" cy="-2" rx="8" ry="10" fill="#0f5228"/>
  <!-- Head -->
  <ellipse cx="0" cy="-12" rx="7" ry="7" fill="#0a3a1a"/>
  <!-- Leaf crown -->
  <ellipse cx="-6" cy="-17" rx="3.5" ry="2" fill="#22aa44" transform="rotate(-30,-6,-17)"/>
  <ellipse cx="0"  cy="-19" rx="3.5" ry="2" fill="#33cc55" transform="rotate(0,0,-19)"/>
  <ellipse cx="6"  cy="-17" rx="3.5" ry="2" fill="#22aa44" transform="rotate(30,6,-17)"/>
  <!-- Eyes — gentle -->
  <ellipse cx="-3" cy="-13" rx="2.5" ry="2" fill="#aaffcc"/>
  <ellipse cx="3"  cy="-13" rx="2.5" ry="2" fill="#aaffcc"/>
  <ellipse cx="-3" cy="-13" rx="1.2" ry="1.2" fill="#052010"/>
  <ellipse cx="3"  cy="-13" rx="1.2" ry="1.2" fill="#052010"/>
  <!-- Healing cross emblem -->
  <rect x="-2" y="-6" width="4" height="10" rx="1" fill="#44ee77" opacity="0.9"/>
  <rect x="-5" y="-3" width="10" height="4" rx="1" fill="#44ee77" opacity="0.9"/>
  <!-- Glow aura -->
  <circle cx="0" cy="0" r="15" fill="none" stroke="#44ee77" stroke-width="0.8" opacity="0.3"/>
  <!-- Floating leaves -->
  <ellipse cx="-12" cy="-4" rx="2.5" ry="1.2" fill="#33cc55" opacity="0.6" transform="rotate(-45,-12,-4)"/>
  <ellipse cx="12"  cy="2"  rx="2.5" ry="1.2" fill="#33cc55" opacity="0.6" transform="rotate(30,12,2)"/>
</svg>
